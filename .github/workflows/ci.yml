name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - uses: actions/checkout@v4

      - run: npm ci
      - run: npm run build

      # Артефакт dist — скачать из Actions и использовать для ручного npm publish
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
